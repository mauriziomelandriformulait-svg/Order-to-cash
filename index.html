<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Pagamenti</title>
    <style>
        html { overflow-x: hidden; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff; 
            color: #1e293b; 
            margin: 0; 
            padding: 10px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
        }
        
        a { text-decoration: none; color: inherit; cursor: pointer; }
        .workflow-container { max-width: 1600px; width: 100%; display: flex; flex-direction: column; gap: 30px; align-items: center; }
        
        /* Titolo principale in nero senza emoji */
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            color: #1e293b;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FDB913;
            width: 100%;
        }

        .main-dashboard-content { display: flex; flex-direction: row; align-items: start; gap: 20px; width: 100%; justify-content: center; }
        .grid-wrapper { display: flex; flex-direction: column; }
        
        .otc-header-container { width: 100%; display: flex; justify-content: flex-start; margin-bottom: 10px; }
        .otc-title { width: 100%; text-align: left; font-size: 20px; font-weight: 600; color: #1e293b; padding-bottom: 10px; border-bottom: 2px solid #FDB913; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-card, .flow-card, .sub-card, .status-card, .sub-card-wide, .fav-card { 
            box-shadow: none !important; font-weight: 700; border: 1px solid #cbd5e1;
            border-bottom: 3px solid #FDB913 !important; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #1e293b;
        }

        .fav-card { 
            background: #f8fafc; border-radius: 6px; padding: 8px; width: 180px; height: 45px; text-align: center; font-size: 11px; flex-direction: row; justify-content: flex-start; gap: 8px; border-bottom: 3px solid #FDB913 !important; color: #1e293b; font-weight: 600; 
        }
        .fav-card:hover { background-color: #fffbeb; }
        
        .column-container { display: flex; flex-direction: column; gap: 5px; align-items: center; height: 100%; }
        .align-bottom { justify-content: flex-end; }
        .input-block-container { display: flex; flex-direction: column; align-items: center; width: 170px; margin-bottom: 5px; }
        .top-inputs-wrapper { display: flex; gap: 10px; align-items: center; justify-content: center; width: 100%; }
        
        .card-icon { width: 20px; height: 20px; margin-bottom: 3px; color: #1e293b; }
        .fan-arrows { display: flex; gap: 80px; color: #94a3b8; font-size: 20px; font-weight: bold; margin-top: 5px; }
        .vertical-arrow { font-size: 18px; color: #94a3b8; font-weight: bold; }
        
        .input-card { background: white; border-radius: 6px; padding: 5px; width: 80px; height: 60px; text-align: center; font-size: 9px; }
        .flow-card { background: white; border-radius: 8px; padding: 10px; width: 170px; height: 80px; gap: 5px; text-align: center; font-size: 12px; }
        .sub-cards-row { display: flex; gap: 10px; margin-top: 5px; }
        .sub-card { background: white; border-radius: 6px; padding: 5px; width: 80px; height: 50px; text-align: center; font-size: 9px; gap: 2px; }
        .sub-card-wide { background: white; border-radius: 6px; padding: 5px; width: 130px; height: 50px; text-align: center; font-size: 11px; gap: 2px; flex-direction: row; }
        .status-card { background: white; border-radius: 6px; padding: 5px; width: 130px; height: 50px; text-align: center; font-size: 12px; gap: 2px; }
        
        .vertical-separator { width: 2px; height: 100%; background-color: #FDB913; margin: 0 20px; }
        .grid-flow-layout { display: grid; grid-template-columns: auto 50px auto 50px auto 50px auto 2px auto; align-items: start; justify-items: center; gap: 10px; }
        .arrow-connector { display: flex; justify-content: center; align-items: center; align-self: center; height: 70px; }
        .arrow-svg { stroke: #FDB913; stroke-width: 1.5; fill: none; width: 40px; }

        /* Stili per le sezioni laterali e navigazione con testo nero */
        .side-column-group { display: flex; gap: 20px; width: 100%; justify-content: center; margin-top: 20px; }
        .side-column { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; width: 280px; box-shadow: none; display: flex; flex-direction: column; gap: 15px; }
        .section-subtitle { font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .links-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .links-list button, .section-subtitle button, .macro-title-btn { background: none; border: none; color: #1e293b; text-decoration: underline; cursor: pointer; font-size: 13px; padding: 2px 0; text-align: left; font-family: inherit; font-weight: 600; }
        .links-list button:hover, .section-subtitle button:hover, .macro-title-btn:hover { color: #d97706; }
    </style>

    <script>
    function inviaMessaggioNavigazione(percorsoTarget) {
        let routePath = percorsoTarget;
        if (percorsoTarget.includes('#')) {
            routePath = percorsoTarget.split('#')[1];
        }

        const payload = {
            type: 'ROUTER_NAVIGATION',
            action: 'navigate',
            url: percorsoTarget,
            route: routePath
        };

        console.log("Invio comando via postMessage per il percorso: " + percorsoTarget);

        try {
            window.parent.postMessage(payload, '*');
            window.parent.postMessage(JSON.stringify(payload), '*');
            console.log("Messaggio inviato correttamente al sistema ERP.");
        } catch (e) {
            console.error("Errore durante l'esecuzione del postMessage:", e);
        }
    }
